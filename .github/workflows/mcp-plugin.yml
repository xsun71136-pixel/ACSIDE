name: ACS MCP Plugin

on:
  push:
    branches: [ main ]
    paths:
      - 'external/plugins/McpServer/**'
      - '.github/workflows/mcp-plugin.yml'
  pull_request:
    paths:
      - 'external/plugins/McpServer/**'
      - '.github/workflows/mcp-plugin.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: false
        default: 'release'
        type: choice
        options: [ release, debug ]
      publish:
        description: 'Attach McpServer.acp to a GitHub Release'
        required: false
        default: false
        type: boolean
  create:

permissions:
  contents: write

concurrency:
  group: acs-mcp-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_DIR: external/plugins/McpServer
  PLUGIN_NAME: McpServer

jobs:
  build:
    name: Build McpServer.acp
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest runner image already ships the Android SDK
      # (/usr/local/lib/android/sdk + cmdline-tools). android-actions/setup-android
      # is deliberately NOT used: it tries to install the removed legacy "tools"
      # package and dies with "sdkmanager failed with exit code 1".
      - name: Prepare Android SDK
        run: |
          set -x
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          echo "sdkmanager=$SM"
          test -x "$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          test -f "$SDK/platforms/android-36/android.jar" || { echo "::error::platforms;android-36 missing"; exit 1; }
          "$SM" --list_installed || true
          ls -1 "$SDK/build-tools" || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Resolve build variant
        id: variant
        run: |
          V="${{ github.event.inputs.variant }}"
          [ -z "$V" ] && V=release
          CAP="$(printf '%s' "${V:0:1}" | tr '[:lower:]' '[:upper:]')${V:1}"
          echo "variant=$V" >> "$GITHUB_OUTPUT"
          echo "task=assemble$CAP" >> "$GITHUB_OUTPUT"
          echo "other=$([ "$CAP" = "Release" ] && echo assembleDebug || echo assembleRelease)" >> "$GITHUB_OUTPUT"
          echo "building variant=$V task=assemble$CAP"

      - name: Diagnose workspace and build files
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          set -x
          pwd
          ls -la
          ls -la main
          ls -la main/meta
          find . -maxdepth 3 \( -name 'build.gradle*' -o -name 'settings.gradle*' -o -name 'libs.versions.toml' \) -printf '%s\t%p\n'
          md5sum build.gradle.kts settings.gradle.kts main/build.gradle.kts gradle/libs.versions.toml gradle.properties
          git -C "$GITHUB_WORKSPACE" status --porcelain -- "$GITHUB_WORKSPACE/$PLUGIN_DIR" | head -20 || true
          git -C "$GITHUB_WORKSPACE" ls-files -s -- "$PLUGIN_DIR" | head -50
          echo '--- main/build.gradle.kts (first 40 lines) ---'
          sed -n '1,40p' main/build.gradle.kts
          echo '--- :main:properties ---'
          ./gradlew --no-daemon -q :main:properties 2>&1 | grep -iE 'buildFile|projectDir|name:|plugins' | head -20 || true
          echo '--- :main:buildEnvironment ---'
          ./gradlew --no-daemon -q :main:buildEnvironment 2>&1 | head -40 || true
          echo '--- root buildEnvironment ---'
          ./gradlew --no-daemon -q buildEnvironment 2>&1 | head -40 || true

      - name: Build plugin (.acp)
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          set -x
          chmod +x ./gradlew || true
          # Use the wrapper only when its jar is a real zip; otherwise fall back to
          # the Gradle CLI installed by gradle/actions/setup-gradle.
          if head -c 2 gradle/wrapper/gradle-wrapper.jar 2>/dev/null | grep -q 'PK'; then
            LAUNCH="./gradlew"
          else
            echo "::warning::gradle-wrapper.jar is not a valid zip, falling back to the gradle CLI"
            LAUNCH="gradle"
          fi
          echo "launcher=$LAUNCH"
          $LAUNCH --version
          # Diagnostics: prove the :main project is configured and show the real
          # task names the Android/ACSIDE plugins registered.
          $LAUNCH --no-daemon projects || true
          $LAUNCH --no-daemon :main:tasks --all || true
          TASK="${{ steps.variant.outputs.task }}"
          OK=""
          for CANDIDATE in ":main:$TASK" ":main:${{ steps.variant.outputs.other }}" ":main:assemble" ":main:build"; do
            echo "----- trying $CANDIDATE -----"
            if $LAUNCH --no-daemon --stacktrace "$CANDIDATE"; then OK="$CANDIDATE"; break; fi
            echo "::warning::$CANDIDATE failed"
          done
          if [ -z "$OK" ]; then
            echo "::error::every Gradle task candidate failed"
            exit 1
          fi
          echo "built with $OK" 
          find . -type f \( -name '*.acp' -o -name '*.apk' \) -printf '%s\t%p\n' || true

      - name: Locate and verify the .acp
        id: acp
        run: |
          set -x
          ACP="$(find "$PLUGIN_DIR" -type f -name '*.acp' -print -quit)"
          if [ -z "$ACP" ]; then
            echo "::error::no .acp was produced by the build"
            find "$PLUGIN_DIR" -type f \( -name '*.apk' -o -name '*.acp' \) -printf '%p\n' || true
            exit 1
          fi
          cp "$ACP" "$PLUGIN_NAME.acp"
          SIZE=$(stat -c %s "$PLUGIN_NAME.acp")
          SUM=$(sha256sum "$PLUGIN_NAME.acp" | awk '{print $1}')
          MAGIC=$(head -c 24 "$PLUGIN_NAME.acp" | tr -d '\0')
          echo "path=$PLUGIN_NAME.acp" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          echo "magic=$MAGIC" >> "$GITHUB_OUTPUT"
          echo "artifact=$PLUGIN_NAME.acp size=$SIZE sha256=$SUM magic='$MAGIC'"
          case "$MAGIC" in
            ACSPluginBasedSystem-1.0) echo "container magic OK" ;;
            *) echo "::warning::unexpected .acp magic '$MAGIC' (expected ACSPluginBasedSystem-1.0)" ;;
          esac

      - name: Also expose the raw plugin apk
        run: |
          APK="$(find "$PLUGIN_DIR/main/build/outputs/apk" -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -n "$APK" ]; then cp "$APK" plugin.apk; echo "apk=$APK size=$(stat -c %s plugin.apk)"; else echo "no apk found"; fi

      - name: Collect metadata
        run: |
          {
            echo "plugin=McpServer"
            echo "version=$(sed -n 's/.*"version"[^"]*"\([^"]*\)".*/\1/p' "$PLUGIN_DIR/main/meta/plugin.json" | head -1)"
            echo "size=${{ steps.acp.outputs.size }}"
            echo "sha256=${{ steps.acp.outputs.sha256 }}"
            echo "magic=${{ steps.acp.outputs.magic }}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "builtAt=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > BUILD_INFO.txt
          cp "$PLUGIN_DIR/repository.json" repository.json
          cp "$PLUGIN_DIR/main/meta/plugin.json" plugin.json
          cp "$PLUGIN_DIR/main/meta/actions.json" actions.json
          cat BUILD_INFO.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: McpServer-acp
          path: |
            McpServer.acp
            plugin.apk
            repository.json
            plugin.json
            actions.json
            BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          VERSION="$(sed -n 's/^version=//p' BUILD_INFO.txt)"
          TAG="mcp-v${VERSION}-${GITHUB_RUN_NUMBER}"
          NOTES="Android Code Studio MCP Server plugin.

          - artifact: McpServer.acp
          - version: ${VERSION}
          - size: ${{ steps.acp.outputs.size }} bytes
          - sha256: ${{ steps.acp.outputs.sha256 }}
          - container magic: ${{ steps.acp.outputs.magic }}
          - commit: ${GITHUB_SHA}

          安装：ACSIDE → 设置 → 插件 → 从本地安装，选择 McpServer.acp。
          安装后打开任意项目文件，「输出与调试 · MCP 服务器」面板会自动出现。"
          gh release create "$TAG" McpServer.acp BUILD_INFO.txt repository.json \
            --title "MCP Server plugin v${VERSION}" \
            --notes "$NOTES" \
            --latest || \
          gh release upload "$TAG" McpServer.acp BUILD_INFO.txt repository.json --clobber
