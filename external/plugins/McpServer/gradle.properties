android.enableJetifier=false
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
# Must stay false: with configuration-on-demand Gradle resolved
# ":main:assembleRelease" before configuring ":main" and failed with
# "task 'assembleRelease' not found in project ':main'".
org.gradle.configureondemand=false
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
